<section class="card">
  <button type="button" class="header" [attr.aria-expanded]="open()" (click)="open.set(!open())">
    <span class="number">{{ '0' + index() }}</span>
    <span class="title">{{ title() }}</span>
    <span class="chevron" [class.open]="open()">▾</span>
  </button>

  @if (open()) {
    <div class="body">
      <p class="description">{{ description() }}</p>

      @if (hasDemo()) {
        <h3>Exemplo</h3>
        <div class="demo"><ng-content /></div>
      }

      <h3>Código</h3>
      <app-code-viewer [files]="files()" />
    </div>
  }
</section>
