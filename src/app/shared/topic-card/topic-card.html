<section class="card" [class.done]="done()">
  <div class="header">
    <button type="button" class="toggle" [attr.aria-expanded]="open()" (click)="open.set(!open())">
      <span class="number">{{ done() ? '✓' : '0' + index() }}</span>
      <span class="title">{{ title() }}</span>
      <span class="chevron" [class.open]="open()">▾</span>
    </button>

    <button
      type="button"
      class="check"
      [attr.aria-pressed]="done()"
      [attr.aria-label]="done() ? 'Desmarcar tópico ' + index() : 'Marcar tópico ' + index() + ' como concluído'"
      (click)="toggleDone()"
    >
      {{ done() ? 'Concluído' : 'Concluir' }}
    </button>
  </div>

  @if (open()) {
    <div class="body">
      <p class="description">{{ description() }}</p>

      @if (hasDemo()) {
        <h3>Exemplo</h3>
        <div class="demo"><ng-content /></div>
      }

      <h3>Código</h3>
      <app-code-viewer [files]="files()" />
    </div>
  }
</section>
