<!-- Lendo os inputs: são signals, por isso os parênteses -->
<strong>{{ product().name }}</strong>
<span class="price">{{ product().price | currency: 'BRL' }}</span>

<button type="button" (click)="add()">
  Adicionar
  @if (inCart() > 0) {
    <span class="badge">{{ inCart() }}</span>
  }
</button>
