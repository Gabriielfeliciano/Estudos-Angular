<aside class="sidebar">
  <a class="profile" routerLink="/">
    <img class="avatar" [src]="profile.photo" alt="Foto de perfil" />
    <span class="who">
      <span class="name">{{ profile.name }}</span>
      <span class="score">{{ progress.doneCount() }}/{{ progress.total }} · {{ progress.percent() }}%</span>
    </span>
  </a>

  <div class="bar" aria-hidden="true">
    <div class="fill" [style.width.%]="progress.percent()"></div>
  </div>

  <!-- Branched Menu: seções do curso com os tópicos em galhos -->
  <app-branched-menu
    [items]="items()"
    [active]="active()"
    [defaultOpen]="allOpen"
    [width]="208"
    [rowHeight]="34"
    [indent]="38"
    color="#ffffff"
    accentColor="#ffe27a"
    lineColor="rgba(255, 255, 255, 0.35)"
    (selected)="navigate($event)"
  />

  <div class="footer"></div>
</aside>
